[package]
name = "textdistance"
version = "0.1.0"
edition = "2021"
description = "30+ string distance/similarity algorithms ported from Python to Rust"
license = "MIT"
repository = "https://github.com/life4/textdistance"
readme = "README.md"

[[bin]]
name = "textdistance"
path = "src/main.rs"

[lib]
name = "textdistance"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
bzip2 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
rayon = "1.8"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "algorithms"
harness = false
